<!-- LOGO PROVISIONAL DE NODO -->
<!-- Dibujado a mano en SVG solo para que la demo se vea completa.       -->
<!-- Reemplazar por el logo oficial manteniendo el nombre del archivo:   -->
<!-- aparece solo en la banda de la foto y en la barra de auspiciantes.  -->
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240">
  <g stroke="#181410" stroke-width="14" stroke-linecap="round">
    <!-- nodos conectados -->
    <path d="M62 120 L128 62 M62 120 L128 178 M128 62 L128 178" fill="none"/>
    <circle cx="62" cy="120" r="26" fill="#e0403a"/>
    <circle cx="128" cy="62" r="20" fill="#f0b13c"/>
    <circle cx="128" cy="178" r="20" fill="#2f9c8e"/>
  </g>
  <text x="188" y="158" font-family="Bungee, Impact, sans-serif" font-size="112"
        fill="#181410" letter-spacing="6">NODO</text>
</svg>
